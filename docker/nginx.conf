server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx writes its temporary files under paths the nginx user owns, so the
    # container can run without root.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fingerprinted bundles can be cached forever. index.html must not be, or a
    # deploy leaves browsers holding a page that references deleted chunks.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # React Router owns the routes: /events/7 is not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
